[project]
name = "graph-ba"
version = "0.2.6"
description = "Graph-based traceability index for BA artifacts — SQLite + FTS5 + NetworkX"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "click>=8.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
graph-ba = "graph_ba.cli:cli"
graph-ba-mcp = "graph_ba.mcp_server:main"
trace-ba = "graph_ba.traceability:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
